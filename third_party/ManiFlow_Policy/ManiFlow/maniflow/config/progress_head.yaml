# Configuration for Spatio-Temporal Progress Head (ProgressHeadST) Training

data:
  # Path to Zarr dataset containing cached DINOv3 tokens and PCHIP progress labels
  zarr_path: "/ros2_ws/data/zarr_datasets/foil_lifting_box_progress.zarr"
  token_key: "wrist_dinov3_tokens"
  progress_key: "progress"
  val_ratio: 0.1
  seed: 42
  num_workers: 4
  in_memory: true

training:
  epochs: 30
  batch_size: 128
  lr: 0.001
  weight_decay: 0.05
  noise_ratio: 0.02
  patch_dropout: 0.3
  device: "cuda"
  save_every: 10

model:
  feature_dim: 384
  num_queries: 2
  dropout: 0.2
  loss_type: "smooth_l1"
  beta: 0.05

logging:
  use_wandb: true
  project: "ManiFlow"
  name: "progress_head_st_dinov3_b128_ep30"

output:
  save_dir: "/ros2_ws/data/outputs/progress"
