name: foil_lifting_aux

shape_meta: &shape_meta
  obs:
    point_cloud:
      shape: [1025, 3]
      type: point_cloud
      horizon: 2
    agent_pos:
      shape: [12]          # = z['state'].shape[-1]
      type: low_dim
      horizon: 2
  action:
    shape: [19]            # 12 + 7 (ee_pose)

env_runner: null

dataset:
  _target_: maniflow.dataset.realdex_dataset.RealDexDataset
  zarr_path: /ros2_ws/data/zarr_datasets/foil_lifting_aux.zarr
  horizon: ${horizon}
  use_progress: true
  aux_action: true
  aux_force: false
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  seed: 42
  val_ratio: 0.02
  use_noise_augmentation: true
  pc_xyz_noise_std: 0.002