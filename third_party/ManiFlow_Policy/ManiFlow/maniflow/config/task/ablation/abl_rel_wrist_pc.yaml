name: abl_rel_wrist_pc

task_name: abl_rel_wrist_pc

# ABLATION B (RELATIVE poses): wrist_rgb + point_cloud.
#
# Relative counterpart of abl_abs_wrist_pc.yaml. Equivalent to
# foil_lifting_relative.yaml with front_rgb left disabled.

shape_meta: &shape_meta
  obs:
    point_cloud:
      shape: [1024, 6]
      type: point_cloud
      horizon: 2
    wrist_rgb:
      shape: [3, 192, 256]
      type: rgb
      horizon: 2
    agent_pos:
      shape: [17]
      type: low_dim
      horizon: 2
  action:
    shape: [17]

env_runner: null

dataset:
  _target_: maniflow.dataset.relative_dataset.RelativeRealDexDataset
  zarr_path: /ros2_ws/data/zarr_datasets/foil_lifting_box_recorded_action.zarr
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  seed: 42
  val_ratio: 0.08
  max_train_episodes: null
  use_wrist_rgb: True
  use_front_rgb: False
  wrist_obs_steps: ${n_obs_steps}
  front_obs_steps: ${n_obs_steps}

  n_obs_steps: ${n_obs_steps}
  assert_invariants: True
  normalizer_samples: 2000

  use_noise_augmentation: True
  pc_xyz_noise_std: 0.002
  agent_pos_noise_std: 0.002