name: abl_rel_wrist

task_name: abl_rel_wrist

# ABLATION A (RELATIVE poses): wrist_rgb ONLY.
#
# Relative counterpart of abl_abs_wrist.yaml. Derived from
# foil_lifting_relative.yaml, so it uses RelativeRealDexDataset and 17-dim
# poses (xyz 3 + 6D rotation 9... see below), NOT the 15-dim absolute layout.
#
# Pair with policy config abl_rel_wrist.yaml, which sets
# proprio_dropout_prob: 0.0 - see that file for the reasoning.
#
# IMPORTANT: val_action_mse is NOT comparable between the absolute and
# relative columns. Relative targets are deltas and therefore smaller in
# magnitude, so relative will look better for reasons that have nothing to do
# with the policy. Compare WITHIN a column only.

shape_meta: &shape_meta
  obs:
    wrist_rgb:
      shape: [3, 192, 256]
      type: rgb
      horizon: 2
    agent_pos:
      # 17, not 15: xyz (3) + 6D rotation (6) + pinch hand (8). The builder
      # writes a quaternion (4); RelativeRealDexDataset converts it to the 6D
      # representation, which is unique per rotation - a quaternion target is
      # two-valued because q and -q are the same rotation.
      shape: [17]
      type: low_dim
      horizon: 2
  action:
    shape: [17]

env_runner: null

dataset:
  _target_: maniflow.dataset.relative_dataset.RelativeRealDexDataset
  zarr_path: /ros2_ws/data/zarr_datasets/foil_lifting_wrist_tesollo.zarr
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  seed: 42
  val_ratio: 0.08
  max_train_episodes: null
  use_wrist_rgb: True
  use_front_rgb: False
  wrist_obs_steps: ${n_obs_steps}
  front_obs_steps: ${n_obs_steps}

  # Must equal the policy's n_obs_steps: the base pose is
  # state[n_obs_steps-1], and a mismatch would relativise against a
  # different frame than deploy does, silently.
  n_obs_steps: ${n_obs_steps}
  assert_invariants: True
  normalizer_samples: 2000

  use_noise_augmentation: True
  pc_xyz_noise_std: 0.002
  # Lower than the absolute config: applied to the relative vector, where 9
  # of 17 channels are a rotation in [-1, 1] rather than metres.
  agent_pos_noise_std: 0.002