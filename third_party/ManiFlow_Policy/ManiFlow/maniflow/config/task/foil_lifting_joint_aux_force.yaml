name: foil_lifting_baseline_cleaned

task_name: foil_lifting_baseline_cleaned

shape_meta: &shape_meta
  # acceptable types: rgb, low_dim
  obs:
    point_cloud:
      shape: [1024, 3]
      type: point_cloud
      horizon: 2
    agent_pos:
      shape: [12]
      type: low_dim
      horizon: 2
    hand_obs:
      shape: [65] 
      type: low_dim
      horizon: 2   # TODO: Check how to be able to work with a longer horizon
  action:
    shape: [12]
  

env_runner: null

dataset:
  _target_: maniflow.dataset.realdex_dataset.RealDexDataset
  zarr_path: /ros2_ws/data/zarr_datasets/foil_lifting_baseline_cleaned.zarr
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  seed: 42
  val_ratio: 0.02
  max_train_episodes: 100
  augment: True
  augment_shift: 0.08