name: box_opening_collection

task_name: box_opening_collection

shape_meta: &shape_meta
  # acceptable types: rgb, low_dim
  obs:
    point_cloud:
      shape: [1025, 3]
      type: point_cloud
      horizon: 2
    agent_pos:
      shape: [13]
      type: low_dim
      horizon: 2
  action:
    shape: [13]

env_runner: null

dataset:
  _target_: maniflow.dataset.realdex_dataset.RealDexDataset
  zarr_path: /ros2_ws/data/zarr_datasets/box_opening_collection.zarr
  horizon: ${horizon}
  use_progress: true
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  seed: 42
  val_ratio: 0.02
  max_train_episodes: 100
  use_noise_augmentation: true      # Enable data augmentation
  pc_xyz_noise_std: 0.002