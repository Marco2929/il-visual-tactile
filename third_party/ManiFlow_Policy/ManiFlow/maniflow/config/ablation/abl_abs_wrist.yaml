# @package _global_
#
# NOTE: the @package directive MUST be the first line. Hydra only reads it
# from the header; placed later it is silently ignored and every key lands
# under cfg.ablation.* (symptom: "Key 'task' is not in struct").
#
# ABLATION A (absolute): wrist_rgb only, NO point cloud.
#
# Inherits everything from maniflow_multimodal_policy.yaml and overrides ONLY
# what defines the condition. Keeping it as an override layer (rather than a
# full copy) means shared hyperparameters cannot drift between conditions -
# which is the whole point of an ablation.
#
# Launch:
#   bash scripts/train_policy.sh ablation/abl_abs_wrist ablation/abl_abs_wrist 0A01 0 0
defaults:
  - /maniflow_multimodal_policy
  # `task` is a defaults-list GROUP in the parent config, so it must be
  # selected with an override here. A top-level `task: abl_abs_wrist` key
  # would instead bind the literal string and leave the real task config
  # unloaded (cfg.task.shape_meta would not exist).
  # Leading / makes the group ABSOLUTE. Without it Hydra resolves the group
  # relative to this file's package and looks for 'ablation/task', which does
  # not exist.
  - override /task: ablation/abl_abs_wrist
  - _self_

policy:
  # No point cloud: builds StateEncoder instead of DP3Encoder, and DiTX
  # receives vis_cond=None so the RGB group becomes the entire
  # cross-attention context.
  pc_conditioned: false
  rgb_keys: ['wrist_rgb']

  # 0.8 for every ABSOLUTE condition. Required, not optional: `action` is
  # effectively the next `agent_pos`, so without this the policy integrates
  # proprioception and ignores vision entirely (measured shuffle_state =
  # 4.75x vs shuffle_wrist 1.29x). Must be identical across A/B/C or the
  # comparison measures dropout strength, not modality.
  proprio_dropout_prob: 0.8

logging:
  group: ablation_modality_abs
  tags:
    - ablation
    - absolute
    - wrist_only