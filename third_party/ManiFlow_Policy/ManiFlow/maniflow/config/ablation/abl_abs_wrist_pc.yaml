# @package _global_
#
# NOTE: the @package directive MUST be the first line (see abl_abs_wrist.yaml).
#
# ABLATION B (absolute): wrist_rgb + point_cloud. Current baseline.
#
# Launch:
#   bash scripts/train_policy.sh ablation/abl_abs_wrist_pc ablation/abl_abs_wrist_pc 0B01 0 0
defaults:
  - /maniflow_multimodal_policy
  - override /task: ablation/abl_abs_wrist_pc
  - _self_

policy:
  # Explicit rather than relying on the default, so the three conditions can
  # be diffed against each other and the setting is visible in the log.
  pc_conditioned: true
  rgb_keys: ['wrist_rgb']
  proprio_dropout_prob: 0.8

logging:
  group: ablation_modality_abs
  tags:
    - ablation
    - absolute
    - wrist_pc