# @package _global_
#
# NOTE: the @package directive MUST be the first line (see abl_abs_wrist.yaml).
#
# ABLATION C (absolute): wrist_rgb + front_rgb, NO point cloud.
#
# The Patch Policy question applied here: can a second dense 2D view replace
# explicit 3D geometry?
#
# Token groups (n_obs_steps=2), SORTED key order - front_rgb < wrist_rgb:
#   front_rgb  192x320 -> 12x20 = 240 tokens/step -> 480
#   wrist_rgb  192x256 -> 12x16 = 192 tokens/step -> 384
#   total 864 context tokens, vs 2432 for condition B.
#
# This condition builds TWO frozen DINOv3 trunks, so total params roughly
# double vs A/B (43.5M vs 21.7M). Because the trunks are FROZEN, trainable
# capacity differs only by one extra Linear(384,384) (~148k) - so C adds a
# VIEW, not capacity. State that when reporting.
#
# Launch:
#   bash scripts/train_policy.sh ablation/abl_abs_wrist_front ablation/abl_abs_wrist_front 0C01 0 0
defaults:
  - /maniflow_multimodal_policy
  - override /task: ablation/abl_abs_wrist_front
  - _self_

policy:
  pc_conditioned: false
  # SORTED order, and it matters: cam_emb row i belongs to rgb_keys[i], and
  # the encoder sorts internally regardless. Writing it sorted here keeps the
  # config honest about the order baked into the checkpoint.
  rgb_keys: ['front_rgb', 'wrist_rgb']
  proprio_dropout_prob: 0.8

  wrist_encoder_cfg:
    # One independent trunk per camera. A top-down view from ~1.5 m and a
    # wrist close-up share almost no image statistics, so a shared trunk
    # would have to cover both. Costs a second 21.7M frozen backbone.
    share_rgb_model: false

# Two trunks roughly double the forward cost of the visual stack and this
# condition carries 864 context tokens, so it is the slowest of the three.
# If it does not fit, prefer gradient accumulation over changing the batch
# size - batch size affects the comparison, accumulation does not.
dataloader:
  batch_size: 96

logging:
  group: ablation_modality_abs
  tags:
    - ablation
    - absolute
    - wrist_front