# =============================================================================
# Experiment B: Paper-exact ManiFlow setup (128 points, 12 layers, 768 emb)
# Reference: "ManiFlow adopts DiTX with 12 layers, 8 heads, emb 768,
#             DP3Encoder with 128 downsampled points, batch 384, 1000 epochs"
# =============================================================================
defaults:
  - task: foil_lifting_augmented

name: train_maniflow_pointcloud_policy

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "maniflow_v2_paper"

horizon: 64
n_obs_steps: 2
n_action_steps: 32
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
keypoint_visible_rate: 1.0
obs_as_global_cond: True

policy:
  _target_: maniflow.policy.maniflow_force_pointcloud_policy.ManiFlowTransformerPointcloudPolicy
  model_name: "DiTX"
  # Paper: 12 layers, 8 heads, 768 embedding
  n_layer: 12
  n_head: 8
  n_emb: 768
  # Paper: 128 downsampled points
  visual_cond_len: 128
  force_cond_len: 0
  max_lang_cond_len: 1
  qkv_bias: false
  qk_norm: false

  force_conditioned: false
  use_force_cnn: false
  use_progress: false
  language_conditioned: false
  pre_norm_modality: false

  flow_batch_ratio: 0.75
  consistency_batch_ratio: 0.25

  sample_t_mode_flow: "beta"
  sample_t_mode_consistency: "discrete"
  sample_dt_mode_consistency: "uniform"
  sample_target_t_mode: "relative"
  denoise_timesteps: 10

  diffusion_timestep_embed_dim: 256
  diffusion_target_t_embed_dim: 256

  use_point_crop: true
  crop_shape:
  - 80
  - 80
  encoder_type: "DP3Encoder"
  encoder_output_dim: 256
  horizon: ${horizon}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}

  num_inference_steps: 10
  obs_as_global_cond: true
  shape_meta: ${shape_meta}

  use_pc_color: false
  pointnet_type: "pointnet"
  downsample_points: true
  pointcloud_encoder_cfg:
    in_channels: 3
    out_channels: ${policy.encoder_output_dim}
    use_layernorm: true
    final_norm: layernorm
    normal_channel: false
    num_points: 128
    pointwise: true
    state_mlp_size:
    - 64
    - 32

ema:
  _target_: maniflow.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 384
  num_workers: 10
  shuffle: True
  pin_memory: True
  persistent_workers: True

val_dataloader:
  batch_size: 128
  num_workers: 10
  shuffle: False
  pin_memory: True
  persistent_workers: False

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 1.0e-3

training:
  device: "cuda:0"
  env_device: "cuda:0"
  seed: 42
  debug: False
  resume: True
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 1000
  gradient_accumulate_every: 1
  use_ema: True
  rollout_every: 50
  checkpoint_every: 50
  val_every: 10
  grad_cam_every: 10
  sample_every: 10
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0
  proprio_mask_max_prob: 0.85
  proprio_mask_warmup_epochs: 1

logging:
  group: ${exp_name}
  id: null
  mode: online
  name: ${training.seed}
  project: ManiFlow
  resume: true
  tags:
  - ${logging.project}

checkpoint:
  save_ckpt: True
  topk:
    monitor_key: train_action_mse_error
    mode: min
    k: 50
    format_str: 'epoch={epoch:04d}-mse={train_action_mse_error:.6f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}