defaults:
  - task: foil_lifting_wrist
  
name: train_maniflow_pointcloud_policy

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "maniflow"

horizon: 64
n_obs_steps: 2
n_action_steps: 32

policy:
  _target_: maniflow.policy.maniflow_multimodal_policy.ManiFlowMultimodalPolicy
  n_layer: 8              # Vorher 12
  n_head: 6               # Vorher 8
  n_emb: 384 
  visual_cond_len: 1024
  qkv_bias: false
  qk_norm: false

  language_conditioned: false
  pre_norm_modality: false

  # ===== RGB conditioning (own token group in DiTX context) =====
  # Covers BOTH cameras: front_rgb (192x320) and wrist_rgb (192x256). The
  # `wrist_*` option names are kept for config/checkpoint compatibility.
  wrist_conditioned: true
  # 'dinov3' = DINOv3ObsEncoder, per-key resolution, frozen trunks.
  # 'transformer' = legacy single-resolution encoder.
  rgb_encoder_type: "dinov3"
  # Which cameras actually feed the RGB encoder. null would pick up EVERY
  # shape_meta obs key with type: rgb, i.e. front_rgb as well - that doubles
  # the conditioning context (864 instead of 432 tokens) even though the
  # trunks are frozen. Baseline runs wrist only, on top of the point cloud.
  #
  # Must be kept in sync with task.dataset.use_front_rgb / use_wrist_rgb:
  # this list controls the ENCODER, those flags control what the dataset
  # reads out of the zarr. A key listed here but not loaded fails the
  # shape_meta assert; a key loaded but not listed is read and thrown away.
  #
  # Order is sorted internally and baked into every checkpoint (cam_emb row i
  # belongs to rgb_keys[i]), so changing this list invalidates old weights.
  rgb_keys: ['wrist_rgb']
  wrist_encoder_cfg:
    # DINOv3 ViT-S/16. Self-supervised, so its dense patch features resolve
    # fine texture (foil wrinkles) far better than supervised ImageNet
    # classification features, which discard local detail early.
    model_name: "vit_small_patch16_dinov3.lvd1689m"
    pretrained: true
    # Frozen: only the per-camera Linear(384, 128) projections train
    # (98,560 params total vs. 43.2M frozen).
    frozen: true
    # One independent backbone per camera. A top-down view from 1.5 m and a
    # wrist close-up share almost no image statistics.
    share_rgb_model: false
    # Per-tower output width. 384 = the full ViT-S/16 hidden size, i.e. NO
    # per-patch channel reduction.
    #
    # This was 128, which put a 3x bottleneck on every patch token:
    #   DINOv3 patch (384) -> Linear(384,128) -> DiTX Linear(128,384) -> n_emb
    # Patch Policy's whole claim is that dense visual control works because
    # per-patch features are NOT compressed before the head. In the reference
    # implementation (models/encoder/dinov3.py) the encoder sets
    # `self.output_dim = self.emb_dim` and hands out raw 384-d tokens; the only
    # projection in the stack widens (Linear(384 -> n_embd=512)). Keeping 192
    # tokens but squeezing each to 128-d preserves SPATIAL density while
    # discarding ~2/3 of the CHANNEL density, which is the same lossy
    # compression as pooling, just on the other axis.
    #
    # Cost is negligible: Linear(384,384) = 147,840 params/camera vs 49,280.
    # NOTE: changes wrist_dim, so DiTX's wrist_cond_emb becomes Linear(384,384)
    # and existing checkpoints CANNOT be resumed from.
    out_dim: 384
    # Image augmentation, train-time only (this encoder previously had NONE,
    # so the wrist stream saw every frame unmodified). Wrist RGB is the
    # strongest visual signal in the hold phase (2.10x) and the foil is
    # whitish-transparent, so lighting robustness matters more than geometry.
    color_jitter:
      brightness: 0.3
      contrast: 0.3
      saturation: 0.3
      hue: 0.05
    # Mild: at grasp distance the foil edge sits near the image centre, and a
    # harder crop can remove the feature the policy depends on. Cropped then
    # resized back, so the patch/token count stays fixed.
    random_crop_ratio: 0.95
    # Interpolates the pretrained pos-embed to the configured resolutions
    # instead of asserting on timm's native 256x256.
    dynamic_img_size: true

  flow_batch_ratio: 0.75
  consistency_batch_ratio: 0.25

  sample_t_mode_flow: "beta" # choose between beta or lognorm, both are performing well
  sample_t_mode_consistency: "discrete" 
  sample_dt_mode_consistency: "uniform"
  sample_target_t_mode: "relative" # "absolute", "relative"
  denoise_timesteps: 10

  diffusion_timestep_embed_dim: 128
  diffusion_target_t_embed_dim: 128

  encoder_type: "DP3Encoder"
  encoder_output_dim: 128
  horizon: ${horizon}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}

  num_inference_steps: 10
  shape_meta: ${shape_meta}

  # Zeroes state_cond; only anti-shortcut mechanism now that proprio masking
  # is gone.
  #
  # 0.8, up from 0.5: the inference-time ablation on run bmq17ag4 measured
  # shuffle_state = 4.75x vs shuffle_wrist 1.29x / shuffle_pc 1.38x, i.e. the
  # policy leans on proprio far more than on either visual stream (8.6x in the
  # approach phase). Root cause is structural - `action` is the next_state of
  # `agent_pos` - so until actions become deltas this dropout is the only
  # lever. At 0.5 the other half of every batch could still be solved from
  # proprio alone.
  proprio_dropout_prob: 0.8
  # PC history length; null = n_obs_steps.
  pc_obs_steps: null

  # true: the foil is whitish and semi-transparent, so the cue that separates
  # it from the pallet is largely photometric. The zarr already stores
  # xyz+rgb (1024, 6) but the policy was slicing [..., :3] away, leaving the
  # PC stream geometry-only - which matches its weak measured contribution
  # (shuffle_pc 1.06x in the search phase).
  # NOTE: flips in_channels 3 -> 6 below and therefore INVALIDATES existing
  # checkpoints; this cannot be resumed from the bmq17ag4 run.
  use_pc_color: true
  pointnet_type: "pointnet"
  # NOTE: the zarr actually stores 1024 points/frame, not 4096, so with
  # num_points=1024 the encoder's `points.shape[1] > self.num_points` guard is
  # never true and FPS never runs - downsample_points is currently a no-op.
  # Lowering num_points would activate a code path that has never executed.
  downsample_points: true
  pointcloud_encoder_cfg:
    # 6 = xyz + rgb, kept in sync with use_pc_color above.
    in_channels: 6
    out_channels: ${policy.encoder_output_dim}
    use_layernorm: true
    final_norm: layernorm # layernorm, none
    normal_channel: false
    num_points: ${policy.visual_cond_len} 
    pointwise: true
    state_mlp_size:
    - 64
    - 32
    

ema:
  _target_: maniflow.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  # With task.dataset.wrist_obs_steps the sample carries only
  # (n_obs_steps=2, 252, 336, 3) uint8 = 0.5 MB instead of the full horizon
  # (64 frames = 16 MB), so the resolution bump is nearly free here.
  batch_size: 96
  num_workers: 4
  shuffle: True
  pin_memory: True
  persistent_workers: True # default False


val_dataloader:
  batch_size: 96
  num_workers: 4
  shuffle: False
  pin_memory: True
  persistent_workers: False

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 1.0e-3

# Only the two Linear projections are trainable now (the DINOv3 trunks are
# frozen), so this no longer protects pretrained weights - it just sets the
# projection lr. Left at the base lr because a freshly initialised linear layer
# has no pretrained features to preserve; null = use the global lr.
# NOTE: the cosine scheduler decays all groups proportionally, so any value
# here acts as a RATIO of the base lr, not as a fixed absolute value.
wrist_encoder_lr: null

training:
  device: "cuda:0"
  env_device: "cuda:0"
  seed: 42
  debug: False
  resume: True
  # Runs the validation block in workspace/train.py, which upstream had
  # hardcoded to False. Required by checkpoint.topk.monitor_key=val_loss:
  # with this False, val_loss is never written and top-k selection is
  # skipped on every epoch.
  run_validation: True
  lr_scheduler: cosine
  lr_warmup_steps: 500
  # 41,157 training windows (238 train / 21 val episodes of the 259 in
  # foil_lifting_wrist_tesollo.zarr) at batch_size 96 => 429 steps/epoch, so
  # 250 epochs ~= 107k steps. The upstream 2010/3000 defaults assume the much
  # smaller sim datasets this repo ships with; at 429 steps/epoch they would
  # mean 860k-1.3M steps here.
  # 80, down from 250: the per-checkpoint sweep on run bmq17ag4 put the
  # action-MSE minimum at epoch 50 (0.00943) with a clear rise afterwards
  # (0.01010 at 100, 0.01257 at latest). val_loss suggested epoch 10, but that
  # is flow-velocity MSE at random t, not the ODE rollout endpoint. 80 leaves
  # headroom past the optimum without burning ~5h on overfitting.
  num_epochs: 80
  gradient_accumulate_every: 1
  use_ema: True
  rollout_every: 50 # 200
  # Keep a divisor of num_epochs so the final epoch is written.
  checkpoint_every: 10
  # --- Validation action metrics (val_action_metrics.py) ---
  # Logs val_action_mse plus a per-phase split (approach/search/hold). This is
  # the metric val_loss is not, and it is what monitor_key now ranks on.
  val_action_metrics: true
  # >1 enables min-over-k: several foil edges are valid grasp points, so MSE
  # against the single recorded demo penalises a different-but-valid choice.
  # min-over-k instead asks whether the demo was inside the sampled
  # distribution. Costs one full ODE rollout per sample, so keep it small.
  val_action_samples: 4
  val_action_max_batches: 8
  val_every: 10
  grad_cam_every: 10
  # --- Grad-CAM frame selection ---
  # "fixed"   : always visualize the dataset indices listed below, so the SAME
  #             frames appear every epoch and changes reflect learning.
  # "rolling" : use whatever training batch is at hand (old behaviour: one
  #             shuffled frame captured on the first batch of epoch 0, reused
  #             forever — you could not choose it).
  grad_cam_source: "fixed"
  # Episode 0 of this zarr spans global index 0-293, so these sample early
  # approach / mid / late contact. Wrist RGB matters most during contact,
  # which the front camera cannot see. Re-check these after any rebuild:
  # they are GLOBAL dataset indices, not per-episode offsets.
  grad_cam_indices: [0, 145, 285]
  # Show the SIGNED Grad-CAM map (diverging blue/red) instead of relu()'d.
  # Standard Grad-CAM discards negative evidence, so any image whose weighted
  # activation sum is negative everywhere renders as flat blue and looks
  # identical to "no gradient at all". Signed mode distinguishes the two:
  #   red  = features here push the loss UP
  #   blue = features here push the loss DOWN
  grad_cam_rgb_signed: true
  sample_every: 10
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

logging:
  group: ${exp_name}
  id: null
  mode: online
  name: ${training.seed}
  project: ManiFlow
  resume: true
  tags:
  - ${logging.project}

checkpoint:
  save_ckpt: True
  topk:
    # val_loss, not train_action_mse_error: with 239 training episodes over
    # 250 epochs the training error keeps falling while generalisation turns,
    # so ranking on it collects the most overfit checkpoints. val_loss is
    # measured on the held-out episodes instead.
    #
    # Note it is noisy: compute_loss() resamples t and the noise on every
    # call, so this is a stochastic estimate averaged over ~36 val batches,
    # not a deterministic score.
    #
    # Both keys below are only written on some epochs (val_every /
    # sample_every), so checkpoint_every must stay a multiple of both -
    # train.py warns and skips top-k for that epoch otherwise.
    # val_action_mse, not val_loss: on run bmq17ag4 ranking by val_loss picked
    # epoch 10 (action MSE 0.01444) while the real optimum was epoch 50
    # (0.00943) - a checkpoint ~53% worse. val_loss is velocity MSE at a
    # random t; the policy is judged on the rollout endpoint, and the two
    # diverged here.
    #
    # It also caused a second, subtler failure: because val_loss rose
    # monotonically after epoch 10, the first ten measurements filled all k=10
    # slots and every later checkpoint was discarded on write - nothing beyond
    # epoch 100 was ever saved. That the optimum happened to fall inside the
    # saved range was luck. save_every_n_epochs below is the guard against
    # that: a fixed grid independent of any ranking, so the choice of metric
    # stays revisable after the fact.
    monitor_key: val_action_mse
    mode: min
    k: 10
    format_str: 'epoch={epoch:04d}-val_action_mse={val_action_mse:.6f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False
  # Rank-independent checkpoint grid; see the monitor_key note above.
  save_every_n_epochs: 20

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
