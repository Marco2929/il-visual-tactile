meta:
  name: "box_opening_exp3"
  task: "Pick up the box and open it"
  fps: 30

# ─── Kinematics ───────────────────────────────────
kinematics:
  urdf_path: "/ros2_ws/src/moveit_ur_hand_config/urdf/inspire_strong_hand_ur10e_flange_workcell.urdf"
  end_link: "right_inspire_base_link"

# ─── Cache Sources ─────────────────────────────────
cache:
  base_dir: "dataset_collection"
  front_rgb: true
  wrist_rgb: true
  front_pc: true
  wrist_pc: true

# ─── Episode Limits ───────────────────────────────
episodes:
  max_episodes: null  # null = all

# ─── Point Cloud Configuration ────────────────────
point_cloud:
  mode: "merged"
  merge_strategy: "fps"
  final_num_points: 1024

# ─── Proprioception ───────────────────────────────
proprioception:
  state_components:
    - type: "joint_states" # CHECK AUGMENTATION FOR PC WITH JOINT STATES
      joints: "arm"
    - type: "hand"
    - type: "force"
  hand:
    hardware: "inspire"
    force:
      enabled: true
      mode: "raw"

# ─── Actions ──────────────────────────────────────
actions:
  type: "next_state"
  derived_from: "joint_states"

# ─── Auxiliary Actions (Multi-Objective Decoder) ──
auxiliary_actions:
  - key: "ee_pose"
    type: "next_state"
    derived_from: "ee_pose"

  - key: "force"
    type: "next_state"
    derived_from: "force"

# ─── Progress Signal ──────────────────────────────
progress:
  enabled: false

# ─── Post-Processing Hooks ────────────────────────
post_processing:
  repeat_final_state:
    enabled: true
    num_repeats: 10

# ─── Output ───────────────────────────────────────
output:
  format: "lerobot"
  zarr_path: "box_opening_exp3.zarr"
  lerobot_repo_id: "Marco2929/box_opening_exp3"
  compression: "zstd"
  chunk_size: 100