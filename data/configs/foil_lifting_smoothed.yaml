meta:
  name: "foil_lifting_big"
  task: "Pick up the box and open it"
  fps: 20

# ─── Kinematics ───────────────────────────────────
kinematics:
  urdf_path: "/ros2_ws/src/moveit_ur_hand_config/urdf/inspire_strong_hand_ur10e_flange_workcell.urdf"
  end_link: "tool0"

# resample:
#   enabled: true
#   target_fps: 15            # source_fps is measured PER EPISODE from timestamps
#   state_smoothing:
#     method: butter          # butter | savgol | none
#     butter_cutoff_hz: 4.0   # smooth joints more aggressively
#     butter_order: 4
#     savgol_window: 7        # only used if method=savgol
#     savgol_polyorder: 3
#   force_smoothing:
#     method: butter
#     butter_cutoff_hz: 9.0   # higher -> preserve contact spikes
#     butter_order: 4

# ─── Cache Sources ─────────────────────────────────
cache:
  base_dir: "foil_lifting_collection"
  front_rgb: true
  wrist_rgb: true
  front_pc: true
  wrist_pc: false

# ─── Episode Limits ───────────────────────────────
episodes:
  max_episodes: null  # null = all
  require_success: true

# ─── Point Cloud Configuration ────────────────────
point_cloud:
  mode: "front_only"
  merge_strategy: "fps"
  final_num_points: 1024

# ─── Proprioception ───────────────────────────────
proprioception:
  state_components:
    - type: "ee_pose"
      joints: "arm"
    - type: "hand"
    - type: "force"
  hand:
    hardware: "inspire"
    force:
      enabled: true
      mode: "raw"

# ─── Actions ──────────────────────────────────────
actions:
  type: "next_state"
  derived_from: "ee_pose"

# ─── Progress Signal ──────────────────────────────
progress:
  enabled: false

# ─── Post-Processing Hooks ────────────────────────
post_processing:
  repeat_final_state:
    enabled: true
    num_repeats: 10

# ─── Output ───────────────────────────────────────
output:
  format: "both"
  zarr_path: "foil_lifting_big.zarr"
  lerobot_repo_id: "Marco2929/foil_lifting_big"
  compression: "zstd"
  chunk_size: 100