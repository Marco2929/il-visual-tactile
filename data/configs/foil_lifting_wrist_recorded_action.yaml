# Copy of foil_lifting_wrist.yaml, differing ONLY in the `actions:` block:
# the action is the teleoperator's recorded COMMAND instead of the measured
# next state. Everything else is held fixed on purpose, so a checkpoint
# trained on this dataset is a clean A/B against the next_state one.
meta:
  name: "foil_lifting_wrist_recorded_action"
  task: "Pinch the foil and lift it"
  # Written per episode into the zarr under meta/task_id and meta/robot_id.
  #
  # task_id 0, the SAME id as foil_lifting_wrist.yaml, is deliberate: this
  # is the identical task on the identical episodes, and the only
  # difference is the action derivation (`actions.type: recorded` instead
  # of next_state). The task the robot performs is unchanged, so the task
  # embedding must be too - otherwise the A/B compares two variables at
  # once. The datasets stay distinguishable by their zarr_path.
  task_id: 0
  # robot_id 10 = UR10e + Tesollo DG-5F.
  robot_id: 10
  fps: 20

# ─── Kinematics ───────────────────────────────────
kinematics:
  urdf_path: "/ros2_ws/src/moveit_ur_hand_config/urdf/tesollo_hand_ur10e_flange_workcell.urdf"
  end_link: "tool0"

# ─── Cache Sources ─────────────────────────────────
# Four collections recorded with the pallet at different positions. They are
# merged into ONE dataset on purpose: the policy should lift the foil
# regardless of pallet position, which is exactly the generalisation the
# position variation was recorded for. The `position` label is carried through
# to the dataset metadata so per-position splits/analyses stay possible
# (e.g. train on front+middle, validate on top_right).
# Episode counts after removing the aborted short recordings
# (see data/record_utils/delete_short_episodes.py):
#   bottom     108
#   middle      49   (7 removed)
#   top_left    50   (2 removed)
#   top_right   52   (3 removed)
#   ---------------
#   total      259
cache:
  base_dirs:
    # ── Older tesollo collections, capped to 35% ──
    # Must stay IDENTICAL to foil_lifting_wrist.yaml, fractions included:
    # this config is the A/B twin that differs only in `actions:`, so any
    # divergence in the source list or the subsample would confound the
    # comparison.
    - dir: "foil_lifting_collection_tesollo_bottom"
      position: "bottom"
      fraction: 0.35
    - dir: "foil_lifting_collection_tesollo_middle"
      position: "middle"
      fraction: 0.35
    - dir: "foil_lifting_collection_tesollo_top_left"
      position: "top_left"
      fraction: 0.35
    - dir: "foil_lifting_collection_tesollo_top_right"
      position: "top_right"
      fraction: 0.35
    # ── New `folien_*` collections (357 episodes, all success) ──
    # No `fraction` = keep all.
    # Must stay IDENTICAL to foil_lifting_wrist.yaml: this config is the
    # A/B twin that differs only in `actions:`, so any divergence in the
    # source list would confound the comparison.
    #
    # Same task as above, different scene: parts in a real transport box at
    # three heights, foil lifted off a named part at a named slot and layer.
    # These ship a labels.json per episode, so their metadata comes from the
    # recording tool rather than the `position` label above.
    - dir: "folien_oben_a_saeule"       # 53 episodes
    - dir: "folien_oben_b_saeule"       # 55
    - dir: "folien_oben_heckleuchte"    # 24
    - dir: "folien_mitte_a_saeule"      # 42
    - dir: "folien_mitte_b_saeule"      # 41
    - dir: "folien_mitte_heckleuchte"   # 20
    - dir: "folien_unten_a_sauele"      # 53  (sic: sauele)
    - dir: "folien_unten_b_sauele"      # 47  (sic: sauele)
    - dir: "folien_unten_heckleuchte"   # 23
  front_rgb: true
  front_depth: false
  wrist_rgb: true
  front_pc: true
  wrist_pc: false

# ─── Episode Limits ───────────────────────────────
episodes:
  max_episodes: null  # null = all
  require_success: true

  # Per-collection keep-fractions live inline on `cache.base_dirs` above.
  default_fraction: null

  # Must match foil_lifting_wrist.yaml: the A/B is only valid if both
  # datasets contain the SAME episodes. A different seed here would
  # silently compare two action derivations on two different subsets.
  subsample_seed: 0

# ─── Point Cloud Configuration ────────────────────
point_cloud:
  mode: "front_only"
  merge_strategy: "fps"
  final_num_points: 1024

# ─── RGB Preprocessing ────────────────────────────
# Stored as uint8 (T, H, W, 3), RGB, UNNORMALIZED.
# The image encoder does /255 (+ model-specific norm) itself.
#
# Backbone is DINOv3 ViT-S/16, so every edge must divide by 16.
#   wrist  480x640 (4:3)  -> 192x256 -> 12x16 = 192 tokens
#   front  360x640 (16:9) -> 192x320 -> 12x20 = 240 tokens
# Both keep their native aspect, so center_crop is a no-op and nothing is
# distorted. The front source is the isotropically halved HD720 frame written
# by record_extractor/extract_episodes.py.
rgb:
  enabled: true
  resolution: [192, 256]    # wrist default
  center_crop: true         # no-op here, aspect already matches
  interpolation: "area"     # best quality for downscaling
  encoder_downsample_ratio: 16
  front_rgb:
    resolution: [192, 320]

# ─── Depth Preprocessing ──────────────────────────
# Stored as float32 (T, H, W, 2) = [normalized_depth, validity].
# NOT currently an observation key of the policy - written to zarr so it can
# be attached later without rebuilding. Resolution tracks front_rgb so the two
# stay pixel-aligned.
depth:
  enabled: false
  resolution: [192, 320]
  center_crop: true
  encoder_downsample_ratio: 16
  depth_range: null         # null = camera_info.FRONT_DEPTH_RANGE_M

# ─── Proprioception ───────────────────────────────
# State = ee_pose (7) + hand. With pinch: true the hand block is 8 instead
# of 20, so state_dim goes 27 -> 15. Actions are derived from the SAME
# hand_state, so action_dim follows automatically.
proprioception:
  state_components:
    - type: "ee_pose"
      joints: "arm"
    - type: "hand"
    - type: "force"
  hand:
    # These collections are T2.esollo DG-5F recordings (20 hand DoF), which is
    # what the raw state.npy actually contains - it is 26 wide = 6 arm + 20
    # hand. The previous "inspire" value only suppressed the mismatch warning.
    hardware: "tesollo"
    # Keep only thumb + index (rj_dg_1_*, rj_dg_2_*) = 8 DoF. The task is a
    # pinch; fingers 3-5 contribute coupled residual motion only (measured
    # summed travel over 12 episodes: f1=74.7 f2=170.3 f3=56.5 f4=42.9
    # f5=45.0 deg). Dropping them removes 12 input dims that the policy would
    # otherwise have to learn to ignore.
    pinch: true
    force:
      enabled: false
      mode: "raw"

# ─── Actions ──────────────────────────────────────
# `recorded` uses arm_action.npy + hand_action.npy, i.e. the commanded tool0
# pose from /teleop/target_pose plus the commanded hand joints - the same two
# quantities control_ur_tesollo_cartesian.py consumes at deploy time.
#
# `next_state` (the other config) sets action[t] = state[t+1], so the target is
# where the robot ENDED UP: servo scaling, cartesian compliance and several
# ticks of tracking lag are all folded into the "action". The policy then
# learns to reproduce that lag as intent, and the executor adds its own on top.
#
# derived_from is omitted: it only selects the SOURCE to difference, which
# `recorded` has no need for - the command is already absolute.
#
# Requires episodes re-extracted after arm_action was added; older ones raise
# rather than silently falling back.
actions:
  type: "recorded"

# ─── Progress Signal ──────────────────────────────
progress:
  enabled: true

# ─── Post-Processing Hooks ────────────────────────
post_processing:
  repeat_final_state:
    enabled: false
    num_repeats: 10

# ─── Output ───────────────────────────────────────
output:
  format: "both"
  # New path for the pinch rebuild (state/action 27 -> 15). Writing over
  # _3 would destroy the full-hand dataset, and the two are not
  # checkpoint-compatible, so A/B needs both on disk.
  # Separate path: this dataset is NOT checkpoint-compatible in meaning with
  # the next_state one (same shape, different action semantics), so writing
  # over it would make the A/B unreproducible.
  zarr_path: "foil_lifting_wrist_tesollo_recorded_action.zarr"
  lerobot_repo_id: "Marco2929/foil_lifting_wrist_tesollo_recorded_action"
  compression: "zstd"
  chunk_size: 100
  # Image streams to persist in the zarr. Previously ALL rgb keys were
  # silently dropped by the writer, so wrist_rgb never made it to disk.
  image_keys: ["wrist_rgb", "front_rgb"]
  image_chunk_size: 8