meta:
  name: "foil_lifting_wrist"
  task: "Pick up the box and open it"
  fps: 30

# ─── Kinematics ───────────────────────────────────
kinematics:
  urdf_path: "/ros2_ws/src/moveit_ur_hand_config/urdf/inspire_strong_hand_ur10e_flange_workcell.urdf"
  end_link: "right_inspire_base_link"

# ─── Cache Sources ─────────────────────────────────
cache:
  base_dir: "foil_lifting_collection"
  front_rgb: true
  wrist_rgb: true
  front_pc: true
  wrist_pc: false

# ─── Episode Limits ───────────────────────────────
episodes:
  max_episodes: null  # null = all
  require_success: true

# ─── Point Cloud Configuration ────────────────────
point_cloud:
  mode: "front_only"
  merge_strategy: "fps"
  final_num_points: 4096

# ─── Proprioception ───────────────────────────────
proprioception:
  state_components:
    - type: "ee_pose"
      joints: "arm"
    - type: "hand"
    - type: "force"
  hand:
    hardware: "inspire"
    force:
      enabled: false
      mode: "raw"

# ─── Actions ──────────────────────────────────────
actions:
  type: "next_state"
  derived_from: "ee_pose"

# ─── Progress Signal ──────────────────────────────
progress:
  enabled: false

# ─── Post-Processing Hooks ────────────────────────
post_processing:
  repeat_final_state:
    enabled: true
    num_repeats: 10

# ─── Output ───────────────────────────────────────
output:
  format: "zarr"
  zarr_path: "foil_lifting_wrist_2.zarr"
  lerobot_repo_id: "Marco2929/foil_lifting_wrist_2"
  compression: "zstd"
  chunk_size: 100