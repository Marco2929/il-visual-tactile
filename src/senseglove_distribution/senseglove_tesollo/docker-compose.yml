services:
  senseglove_tesollo:
    image: ${SENSEGLOVE_IMAGE:-senseglove/robotics:latest}
    container_name: senseglove_tesollo
    network_mode: host
    privileged: true
    tty: true
    volumes:
      - /dev:/dev
    command:
      - bash
      - -c
      - ros2 launch dg5f_interaction dg5f_robot_hand_mapper.launch.py
