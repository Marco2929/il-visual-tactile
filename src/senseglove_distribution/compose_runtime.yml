services:
  senseglove_tesollo:
    image: zippeth/senseglove_robotics:latest
    container_name: senseglove_tesollo
    network_mode: host
    privileged: true
    tty: true
    environment:
    - DISPLAY=${DISPLAY}
    - QT_X11_NO_MITSHM=1
    volumes:
    - /dev:/dev
    - /tmp/.X11-unix:/tmp/.X11-unix
    command:
    - bash
    - -c
    - ros2 launch dg5f_interaction dg5f_robot_hand_mapper.launch.py hand:=right glove_id:=70
      delto_ip:=192.168.56.110 delto_ip_rh:=192.168.56.110
