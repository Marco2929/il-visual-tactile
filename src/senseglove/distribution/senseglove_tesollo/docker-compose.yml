services:
  senseglove_tesollo:
    image: ${SENSEGLOVE_IMAGE:-senseglove/robotics:latest}
    container_name: senseglove_tesollo
    network_mode: host
    privileged: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      # Join the Cyclone DDS domain the rest of the workspace uses, so the
      # DG5F joint states are visible to ros2_dev / zed_container. Requires a
      # cyclone-* image tag (see build_cyclone_image.sh); the stock SenseGlove
      # image ships Fast DDS only and would fail to load this RMW.
      - RMW_IMPLEMENTATION=${SENSEGLOVE_RMW:-rmw_cyclonedds_cpp}
      - CYCLONEDDS_URI=file:///tmp/cyclonedds.xml
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix
      # Same discovery config as the other containers (loopback, no multicast).
      # Path resolves from compose_runtime.yml, which start.py writes into
      # src/senseglove/distribution/ - not from this file's own directory.
      - ../../../docker/cyclonedds.xml:/tmp/cyclonedds.xml:ro
    # NOTE: start.py overwrites this `command` (see run_compose), so editing it
    # here has no effect when launched via start.py. The /joint_states relay is
    # therefore added in build_launch_command instead.
    command:
      - bash
      - -c
      - ros2 launch dg5f_interaction dg5f_robot_hand_mapper.launch.py
