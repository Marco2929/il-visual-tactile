services:
  policy_inference:
    build:
      context: ../..
      dockerfile: docker/production/Dockerfile.PolicyInference
    container_name: maniflow_policy_inference
    network_mode: host
    ipc: host
    shm_size: "16gb"
    privileged: true
    environment:
      # Passend zum MoveIt Pro Workspace (Standard 42 statt 0)
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video

      # --- Kinematik-Auswahl (UR10e vs. UR8L) ---
      # Standard: UR10e Tesollo Workcell
      - URDF_PATH=/ros2_ws/models/tesollo_hand_ur10e_flange_workcell.urdf
      - ROBOT_TIP_FRAME=tool0
      # Für UR8L oder andere Kinematiken einfach einkommentieren:
      # - URDF_PATH=/ros2_ws/models/ur8l_workcell.urdf

      # --- Camera Topics: set from outside (shell export or --env-file moveit_pro.env).
      # The defaults are the il-visual-tactile originals.
      - WRIST_COLOR_TOPIC=${WRIST_COLOR_TOPIC:-/cam_gemini/color/image_raw}
      - ZED_COLOR_TOPIC=${ZED_COLOR_TOPIC:-/zed/zed_node/rgb/color/rect/image}
      - ZED_DEPTH_TOPIC=${ZED_DEPTH_TOPIC:-/zed/zed_node/depth/depth_registered}

    volumes:
      # DDS Shared Memory
      - /dev/shm:/dev/shm
      # MoveIt Pro CycloneDDS Profil einhängen (falls vorhanden):
      # - /path/to/prehensio-ws/config/cyclonedds.xml:/etc/cyclonedds.xml:ro
      - ./cyclonedds.xml:/etc/cyclonedds.xml:ro

      # Outputs, Checkpoints und Configs (read-only für Production)
      - ../../data/outputs:/ros2_ws/data/outputs:ro
      - ../../data/configs:/ros2_ws/data/configs:ro

      # Externe URDFs (z. B. wenn das UR8L URDF dynamisch hinzugefügt wird)
      - ../../src/moveit_ur_hand_config/urdf:/ros2_ws/models:ro

      # ManiFlow Source Code
      - ../../third_party/ManiFlow_Policy/ManiFlow:/ros2_ws/src/maniflow:ro

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, video, utility]
    tty: true
    stdin_open: true
    # Startet standardmäßig den Action Server Daemon
    command: >
      python3 /ros2_ws/src/maniflow/policy_action_server.py
