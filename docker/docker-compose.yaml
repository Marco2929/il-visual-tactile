services:
  vivetracker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ViveTracker  
    container_name: vivetracker
    privileged: true
    network_mode: host
    devices:
      - /dev/bus/usb:/dev/bus/usb       
    volumes:
      - /home/mm/dev/il-visual-tactile/src/libsurvive_ros2/config:/home/ros/.config/libsurvive:rw
      - ./cyclonedds.xml:/tmp/cyclonedds.xml:ro    
    entrypoint: /home/ros/ros2_ws/entrypoint.sh
    environment:
      - ROS_DOMAIN_ID=0
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/tmp/.docker.xauth
      - CYCLONEDDS_URI=file:///tmp/cyclonedds.xml
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all    
    working_dir: /home/ros/ros2_ws
    command: ros2 launch libsurvive_ros2 libsurvive_ros2.launch.py foxbridge:=true composable:=false extra_args:="--no-global-scene-solver"

  ros2_dev:
    build:
      dockerfile: Dockerfile.ROS_Dev
    container_name: ros2_dev
    network_mode: host
    shm_size: '16gb'
    ipc: host
    privileged: true
    environment:
      - ROS_DOMAIN_ID=0
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/tmp/.docker.xauth
      - CYCLONEDDS_URI=file:///tmp/cyclonedds.xml
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes: 
      - ../src/il_main:/ros2_ws/src/il_main:rw
      - ../src/cam_calibrate:/ros2_ws/src/cam_calibrate:rw
      - ../src/senseglove_ros/senseglove/senseglove_description/urdf:/ros2_ws/src/il_main/third_party/senseglove/senseglove_description/urdf:rw

      - ../src/hands/rh56dfx_descrption:/ros2_ws/src/hands/rh56dfx_descrption:rw
      - ../src/hands/Sarcomere_Dynamics_Resources:/ros2_ws/src/hands/artus_hand:rw
      - ../src/hands/inspire_hand_Linkage:/ros2_ws/src/hands/inspire_hand_strong_hand:rw
      - ../src/hands/delto_m_ros2:/ros2_ws/src/hands/tesollo_hand:rw
      - ../src/rembrandt_ros/r1_msgs:/r1_ws/src/r1_msgs:rw
      
      - ../third_party:/ros2_ws/third_party:rw
      - ../data:/ros2_ws/data:rw
      - /mnt/data/data:/ros2_ws/data/episodes/external:rw

      - ../src/moveit_ur_hand_config:/ros2_ws/src/moveit_ur_hand_config:rw
      - ../src/cartesian_controllers:/ros2_ws/src/cartesian_controllers:rw
      - ../src/cartesian_controllers_universal_robots:/ros2_ws/src/cartesian_controllers_universal_robots:rw
      - ./ur_entrypoint.sh:/ros2_ws/ur_entrypoint.sh:rwx
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /tmp/.docker.xauth:/tmp/.docker.xauth

      - ./cyclonedds.xml:/tmp/cyclonedds.xml:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, video, utility]
    tty: true
    stdin_open: true
    command: >
        /bin/sh -c "tail -f /dev/null"
#bash -c "bash /ros2_ws/ur_entrypoint.sh && exec bash"


  senseglove:
    build:
      dockerfile: Dockerfile.Senseglove
      args:
        ROS_DISTRO: jazzy 
    privileged: true
    container_name: senseglove
    network_mode: host
    volumes:
      - ../src/senseglove_ros:/root/workspace/src/senseglove_ros:rw
      - ./entrypoint.sh:/entrypoint.sh:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev
      - /var/run/dbus:/var/run/dbus:rw
      - ./cyclonedds.xml:/tmp/cyclonedds.xml:ro
    environment:
      - CYCLONEDDS_URI=file:///tmp/cyclonedds.xml
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DISTRO=jazzy
      - ROS_DOMAIN_ID=0
      - XDG_RUNTIME_DIR=/tmp/runtime-root
    group_add:
      - dialout
      - bluetooth 
    tty: true
    stdin_open: true

  senseglove_r1:
    build:
      dockerfile: Dockerfile.Senseglove_r1
      args:
        ROS_DISTRO: jazzy 
    privileged: true
    container_name: senseglove_r1
    network_mode: host
    volumes:
      - ../src/rembrandt-api:/r1_ws/src/rembrandt-api:rw
      - ../src/rembrandt_ros:/r1_ws/src/rembrandt_ros:rw
      - ./r1_entrypoint.sh:/r1_entrypoint.sh:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev
      - /var/run/dbus:/var/run/dbus:rw
      - ./cyclonedds.xml:/tmp/cyclonedds.xml:ro
    environment:
      - CYCLONEDDS_URI=file:///tmp/cyclonedds.xml
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DISTRO=jazzy
      - ROS_DOMAIN_ID=0
      - XDG_RUNTIME_DIR=/tmp/runtime-root
    group_add:
      - dialout
    tty: true
    stdin_open: true  

  zed-camera:
    build:
      context: ..
      dockerfile: docker/Dockerfile.Zed
      args:
        UBUNTU_MAJOR: "24"
        UBUNTU_MINOR: "04"
        CUDA_MAJOR: "12"
        CUDA_MINOR: "8"
        CUDA_PATCH: "0"
        ZED_SDK_MAJOR: "5"
        ZED_SDK_MINOR: "2"
        ZED_SDK_PATCH: "0"
    container_name: zed_container
    privileged: true
    network_mode: host
    ipc: host
    tty: true
    stdin_open: true

    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video, compute, utility]

    device_cgroup_rules:
      - 'c 189:* rmw'

    devices:
      - /dev/bus/usb:/dev/bus/usb
      - /dev:/dev
    entrypoint: /sbin/ros_entrypoint.sh
    environment:
      - ROS_DOMAIN_ID=0
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/tmp/.docker.xauth
      - CYCLONEDDS_URI=file:///tmp/cyclonedds.xml
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./cyclonedds.xml:/tmp/cyclonedds.xml:ro
      - ../data:/root/ros2_ws/data:rw
      - /mnt/data/data:/root/ros2_ws/data/episodes/external:rw
      - /tmp/.docker.xauth:/tmp/.docker.xauth:rw
      - /dev:/dev
    command: >
        /bin/sh -c "tail -f /dev/null"

  realsense_435i_multi:
    build:
      context: .
      dockerfile: Dockerfile.Realsense_435i_multi
    container_name: realsense_435i_multi
    network_mode: host
    shm_size: '16gb'
    privileged: true
    environment:
      - ROS_DOMAIN_ID=0
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/tmp/.docker.xauth
      - CYCLONEDDS_URI=file:///tmp/cyclonedds.xml
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - XAUTHORITY=/tmp/.docker.xauth
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./cyclonedds.xml:/tmp/cyclonedds.xml:ro
      - /tmp/.docker.xauth:/tmp/.docker.xauth
    tty: true
    stdin_open: true
    command: >
      bash -c "
      ros2 launch realsense2_camera rs_launch.py
      camera_namespace:=cam_right
      camera_name:=cam_right
      serial_no:=_313522072162
      rgb_camera.color_profile:=640,480,30
      depth_module.depth_profile:=640,480,30
      enable_rgbd:=true
      align_depth.enable:=true
      enable_sync:=true
      initial_reset:=true;
      wait"

  orbbec_gemini305:
    build:
      context: .
      dockerfile: Dockerfile.Orbbec_Gemini305
    container_name: orbbec_gemini305
    network_mode: host
    shm_size: '16gb'
    privileged: true
    environment:
      - ROS_DOMAIN_ID=0
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/tmp/.docker.xauth
      - CYCLONEDDS_URI=file:///tmp/cyclonedds.xml
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./cyclonedds.xml:/tmp/cyclonedds.xml:ro
      - /tmp/.docker.xauth:/tmp/.docker.xauth
    tty: true
    stdin_open: true
    command: >
      bash -c "
      ros2 launch orbbec_camera gemini_301_series.launch.py
      camera_name:=cam_gemini
      depth_registration:=true
      enable_point_cloud:=true
      enable_colored_point_cloud:=false
      color_width:=640 color_height:=480 color_fps:=30
      depth_width:=640 depth_height:=480 depth_fps:=30
      enable_sync_output_accel_gyro:=false;
      wait"

# Gemini 305 helpers:
#   list connected devices:  ros2 run orbbec_camera list_devices_node
#   multi-cam: add a second service and pass serial_number:=<SN> + unique camera_name

